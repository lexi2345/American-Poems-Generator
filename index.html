<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="ie=edge" />
  <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
  <script src="https://unpkg.com/typewriter-effect@latest/dist/core.js"></script>

    <link rel="stylesheet" href="src/style.css">
    <title>American-Poems-Generator</title>
</head>
<body>

  <div class="container">
    <h1> The Poem Generator
    </h1>
     </div>
 </header>
      <div class="form-container">
      <form id="poem-generator">
        <input
          type="text"
          id="Instructions"
          autofocus class="Instructions"
          placeholder="Enter the topic of the Poem"
          autofocus
          required
          autocomplete="off"
          class="Instructions"
             id="user-instructions"
        />
      <input type="submit" value="Generate Poems" class=" btn" id="submit-button" />
        </form>
         <div class="hint">i.e: Flower, New York or Music</div>
        </div>
        <div class="poem" id="poem"></div>
      </div>

   <footer>
      This AI project was coded by
      <a href="https://github.com/lexi2345" target="_blank">Alexis Cantrell</a> and
      is
      <a
        href="https://github.com/lexi2345/American-Poems-Generator"
        target="_blank"
      >
        open-sourced on GitHub</a
      >
      and is
      <a href="https://americanpoemgenerator.netlify.app/" target="_blank"
        >hosted on Netlify</a
      >.
    </footer>
</div>

    <script src="src/script.js"></script>
</body>

</html>
