<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://unpkg.com/typewriter-effect@latest/dist/core.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.1.2/dist/axios.min.js"></script>
    <link rel="stylesheet" href="src/style.css">
    <title>American-Poems-Generator</title>
</head>
<body>
  <div class="container">
    <h1> Welcome to the American Poem Generator</h1>
 </header>

    <main>
       <div class="form-container">
      <form id="poem-generator-form">
        <input
          type="text"
          placeholder="Enter the topic of the American Poem"
          autofocus
          required
          autocomplete="off"
          class="Instructions"
             id="user-instructions"
        />
      <input type="submit" class="submit-button" />
        </form>
         <div class="hint">i.e: Flower, New York or Music</div>
        </div>
        <div class="poem hidden" id="poem"></div>
    </main>

   <footer>
      This AI project was coded by
      <a href="https://github.com/lexi2345" target="_blank">Alexis Cantrell</a> and
      is
      <a
        href="https://github.com/lexi2345/American-Poems-Generator"
        target="_blank"
      >
        open-sourced on GitHub</a
      >
      and is
      <a href="https://americanpoemgenerator.netlify.app/" target="_blank"
        >hosted on Netlify</a
      >.
    </footer>
</div>

    <script src="src/script.js"></script>
</body>

</html>
