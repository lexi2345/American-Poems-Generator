<body>
  <div class="container">
    <h1> Welcome to the American Poem Generator</h1>
 </header>


 <main>
      <form>
        <input
          type="text"
          placeholder="Enter the topic of the American Poem"
          autofocus
          required
          autocomplete="off"
          class="Instructions"
        />
        <input type="submit" class="submit-button" />
      </form>
      <div class="Poem">
       The line-storm clouds fly tattered and swift, 
        <br />
       The road is forlorn all day, 
      </div>
    </main>

</div>
